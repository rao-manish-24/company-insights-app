# Render Blueprint — free-tier friendly deploy
# https://render.com/docs/blueprint-spec
#
# After deploy:
# 1) Set secrets on companyinsights-api (NEWS_API_KEY, LLM_API_KEY, SMTP_*, etc.)
# 2) Set CORS_ORIGINS to your static site URL (https://companyinsights-web.onrender.com)
# 3) Set VITE_API_BASE_URL on companyinsights-web to https://companyinsights-api.onrender.com/api
# 4) Manual Deploy / clear build cache on the static site so Vite picks up the API URL

databases:
  - name: companyinsights-db
    plan: free
    databaseName: companyinsights
    user: companyinsights

services:
  - type: web
    name: companyinsights-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: companyinsights-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.x.ai/v1
      - key: LLM_MODEL
        value: grok-4.5
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: LOG_FILE
        value: ""
      - key: ANALYSIS_CACHE_HOURS
        value: "48"
      - key: NEWS_CACHE_MINUTES
        value: "120"
      - key: MAX_ARTICLES
        value: "6"
      - key: ANALYZE_RATE_LIMIT
        value: "10"
      - key: ANALYZE_RATE_WINDOW_SECONDS
        value: "3600"
      - key: REFRESH_COOLDOWN_MINUTES
        value: "5"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Company Insights <onboarding@resend.dev>
      - key: EMAIL_TO
        sync: false
      - key: EMAIL_AUTO_SEND
        value: "false"

  - type: web
    name: companyinsights-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Don't serve the SPA for /api/* — send those to the API service instead
      # (see https://render.com/docs/redirects-rewrites)
      - type: redirect
        source: /api/*
        destination: https://companyinsights-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
